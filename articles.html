<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Articles Ouest-France | Mathieu Garcia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', Arial;
    margin: 0;
    background: #f4f6f8;
}

/* HEADER */
.header {
    background: linear-gradient(90deg, #0a1f44, #1d3557);
    color: white;
    padding: 25px;
    text-align: center;
}

/* UNE */
.hero {
    position: relative;
    max-width: 1100px;
    margin: 30px auto;
    border-radius: 12px;
    overflow: hidden;
}

.hero img {
    width: 100%;
    height: 350px;
    object-fit: cover;
}

.hero-text {
    position: absolute;
    bottom: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    color: white;
    width: 100%;
    padding: 20px;
}

.hero-text h2 {
    margin: 0;
    font-size: 28px;
}

.hero-text p {
    margin: 5px 0;
}

/* ONGLETS */
.tabs {
    display: flex;
    justify-content: center;
    background: #e63946;
}

.tabs button {
    background: none;
    border: none;
    color: white;
    padding: 15px;
    cursor: pointer;
    font-weight: bold;
}

.tabs button:hover {
    background: #c1121f;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 30px;
    max-width: 1100px;
    margin: auto;
}

/* CARD */
.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 14px;
    background: #e63946;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

footer {
    text-align: center;
    padding: 20px;
    background: #0a1f44;
    color: white;
}
</style>
</head>

<body>

<div class="header">
    <h1>📰 Mes articles Ouest-France</h1>
</div>

<!-- UNE PRINCIPALE -->
<div class="hero">
    <img src="https://via.placeholder.com/1200x400?text=SM+Caen">
    <div class="hero-text">
        <h2>SM Caen enfonce Dives-Cabourg</h2>
        <p>Une victoire importante en National 3 pour la réserve caennaise</p>
        <a href="https://www.ouest-france.fr/sport/football/sm-caen/football-national-3-le-sm-caen-enfonce-dives-cabourg-3c56b310-40e4-11f1-acf7-4654cd3332b5" class="btn" target="_blank">Lire l'article</a>
    </div>
</div>

<!-- ONGLETS -->
<div class="tabs">
    <button onclick="filter('all')">Tous</button>
    <button onclick="filter('foot')">Football</button>
    <button onclick="filter('autres')">Autres sports</button>
</div>

<!-- ARTICLES -->
<div class="grid">

<div class="card foot">
    <img src="https://via.placeholder.com/400x200?text=Vire">
    <div class="card-content">
        <h3>Vire relance le championnat</h3>
        <a href="https://www.ouest-france.fr/sport/football/vire-af/football-national-3-ce-match-relance-le-championnat-juge-dorian-charlier-af-virois-en-quete-dune-montee-3d695344-3be3-11f1-a950-0332529e658c" class="btn" target="_blank">Lire</a>
    </div>
</div>

<div class="card autres">
    <img src="https://via.placeholder.com/400x200?text=Badminton">
    <div class="card-content">
        <h3>Relégation logique pour Caen</h3>
        <a href="https://www.ouest-france.fr/sport/badminton/badminton-top-12-la-relegation-est-logique-regis-le-goff-president-de-caen-revient-sur-la-saison-de-son-club-6ecc4776-3660-11f1-aa8d-862764c4f0ec" class="btn" target="_blank">Lire</a>
    </div>
</div>

</div>

<footer>
    © MathouTheOne — Portfolio
</footer>

<script>
function filter(category) {
    let cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        if(category === 'all') {
            card.style.display = 'block';
        } else {
            card.style.display = card.classList.contains(category) ? 'block' : 'none';
        }
    });
}
</script>

</body>
</html>
